l_english:

  moh_je_boxer_rebellion_completed_desc: "Control over the Han homelands has been restored, bringing the Boxer crisis to a conclusion."
  moh_je_boxer_rebellion_failed_desc: "A treaty prohibiting the Boxer movement has ended official support for it."

  moh_je_daoguang_reform_main_completed_desc: "Daoguang's reforms have addressed grain transport, mining, and the opium question."
  moh_je_daoguang_reform_main_failed_desc: "Daoguang's reform program has ended before all of its objectives could be achieved."

  moh_je_xianfeng_completed_desc: "The Xianfeng Emperor's life and reign have come to an end."
  moh_je_xianfeng_failed_desc: "The pressures of the reign have exhausted the Xianfeng Emperor, bringing his rule to an early end."

  moh_je_father_of_the_republic_completed_desc: "China has been reunited, and the Father of the Nation has assumed its leadership."
  moh_je_father_of_the_republic_failed_desc: "The Father of the Nation has died before his hopes for a united China could be fulfilled."

  moh_je_keju_failed_desc: "The imperial examination system has been abolished, bringing an era of official recruitment to an end."

  moh_je_new_dynasty_completed_desc: "The rebels have decided whether to found a new dynasty or retain the existing dynastic name."
  moh_je_new_dynasty_failed_desc: "The political circumstances that made a new dynasty possible have ended before a dynastic choice was made."

  moh_je_opium_obsession_completed_desc: "A sustained ban on opium has brought the opium crisis to a conclusion."
  moh_je_opium_obsession_failed_desc: "Foreign pressure and the opening of trade have defeated the effort to maintain the opium ban."

  moh_je_self_strengthing_completed_desc: "Reforms in at least three fields have fulfilled the Self-Strengthening Movement's goals."
  moh_je_self_strengthing_failed_desc: "Military defeats or the loss of regional influence have brought the Self-Strengthening Movement to a halt."

  moh_je_warlord_china_completed_desc: "Reform, international recognition, and the recovery of sovereignty have secured the country's unity."
  moh_je_warlord_china_failed_desc: "The bonds holding China together have broken, plunging the country into a new struggle for power."

  moh_je_wuxu_completed_desc: "Reforms to government, the military, and education have secured the reformers' victory."
  moh_je_wuxu_failed_desc: "Conservative resistance has defeated the reformers and brought the reform program to an end."

  moh_je_xinhai_completed_desc: "The revolutionary challenge to the old order has ended through political change or the elimination of its leaders."
  moh_je_xinhai_failed_desc: "Open civil war has replaced the struggle between the court and the revolutionary movements."

  je_wuxu_concluded: "Constitutional Reform"
  je_heavenly_land_system: "$law_heavenly_land_system$"
  je_heavenly_land_system_reason: "$law_heavenly_land_system_desc$"
